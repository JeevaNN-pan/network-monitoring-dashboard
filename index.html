<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Network Monitoring Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:20px; }
  h1 { color:#58a6ff; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:16px; }
  .status-up { color:#3fb950; font-weight:bold; }
  .status-down { color:#f85149; font-weight:bold; }
  table { width:100%; border-collapse: collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px; border-bottom:1px solid #30363d; font-size:14px; }
  select { background:#161b22; color:#e6edf3; border:1px solid #30363d; padding:6px; border-radius:4px; }
</style>
</head>
<body>
  <h1>Network Monitoring Dashboard</h1>
  <p>Live availability for the devices defined in <code>devices.yaml</code>. Refreshes every 15s.</p>

  <div class="grid" id="status-grid"></div>

  <div class="card">
    <h3>Latency history</h3>
    <select id="device-select"></select>
    <canvas id="latency-chart" height="90"></canvas>
  </div>

  <div class="card">
    <h3>Uptime summary</h3>
    <table id="summary-table">
      <thead><tr><th>Device</th><th>Total checks</th><th>Uptime %</th><th>Avg latency (ms)</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const statusGrid = document.getElementById('status-grid');
const deviceSelect = document.getElementById('device-select');
const summaryBody = document.querySelector('#summary-table tbody');
let chart;

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Request failed: ' + url);
  return res.json();
}

async function refreshStatus() {
  const statuses = await fetchJSON('/api/status');
  statusGrid.innerHTML = '';
  const names = [];
  statuses.forEach(s => {
    names.push(s.name);
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<strong>' + s.name + '</strong><br>' +
      '<span>' + s.ip + ' (' + s.device_type + ')</span><br>' +
      '<span class="' + (s.is_up ? 'status-up' : 'status-down') + '">' +
      (s.is_up ? '● UP' : '● DOWN') + '</span><br>' +
      '<span>Latency: ' + (s.latency_ms ? s.latency_ms.toFixed(1) + ' ms' : 'N/A') + '</span>';
    statusGrid.appendChild(div);
  });

  if (deviceSelect.options.length !== names.length) {
    deviceSelect.innerHTML = names.map(n => '<option value="' + n + '">' + n + '</option>').join('');
  }
}

async function refreshSummary() {
  const summary = await fetchJSON('/api/summary');
  summaryBody.innerHTML = summary.map(s =>
    '<tr><td>' + s.name + '</td><td>' + s.total_checks + '</td><td>' + s.uptime_pct +
    '%</td><td>' + (s.avg_latency_ms ?? 'N/A') + '</td></tr>'
  ).join('');
}

async function refreshChart() {
  const device = deviceSelect.value;
  if (!device) return;
  const history = await fetchJSON('/api/history/' + device);
  const points = history.reverse();
  const labels = points.map(p => new Date(p.checked_at).toLocaleTimeString());
  const data = points.map(p => p.latency_ms);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('latency-chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{ label: device + ' latency (ms)', data, borderColor: '#58a6ff', tension: 0.2 }]
    },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

async function refreshAll() {
  try {
    await refreshStatus();
    await refreshSummary();
    await refreshChart();
  } catch (err) {
    console.error(err);
  }
}

deviceSelect.addEventListener('change', refreshChart);
refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
